<title>Stereo Matuška slideshow</title>
<style>

  #f{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size;overflow:hidden}
  #s{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  #s[hidden]{display:none}                      /* u zástupného slidu bez fotky */
  /* outro do rytmu: vrstvy z outro/vrstvy/ (pozadí, oblouk, slovo) */
  #outro{position:absolute;inset:0;width:100%;height:100%;display:block}
  #outro[hidden]{display:none}
  /* neon: zhasnutá verze přes rozsvícenou, krytí řídí skript (Ondra 10. 10.) */
  #noff{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  #noff[hidden]{display:none}
  /* plakáty den ↔ noc: noční mockup srovnaný na denní plakát přes denní, prolnutí 1,4 s brand easingem (Ondra 11. 10.) */
  #pnoc{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;opacity:0}
  #pnoc[hidden]{display:none}
  /* závěs se zatáhne (slide 15, Ondra 11. 10.): přes slide 15 leží slide 14 – ve skle maskovaný pohyblivou hranou (--x0/--x1),
     mimo sklo se jen prolíná (opacity); u hrany stín; slide 15 roztažený (fill), ať sedí na slide 14 */
  #s.fill{object-fit:fill}
  #z14,#z14v{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}
  #z14{-webkit-mask-image:url(slideshow/zaves-sklo.png),linear-gradient(to right,transparent var(--x0),#000 var(--x1));-webkit-mask-size:100% 100%;-webkit-mask-composite:source-in;
       mask-image:url(slideshow/zaves-sklo.png),linear-gradient(to right,transparent var(--x0),#000 var(--x1));mask-size:100% 100%;mask-composite:intersect}
  #z14v{-webkit-mask-image:url(slideshow/zaves-mimo.png);-webkit-mask-size:100% 100%;mask-image:url(slideshow/zaves-mimo.png);mask-size:100% 100%}
  #zhr{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(var(--x) - 3%),rgba(0,0,0,.45) var(--x),transparent calc(var(--x) + .6%));
       -webkit-mask-image:url(slideshow/zaves-sklo.png);-webkit-mask-size:100% 100%;mask-image:url(slideshow/zaves-sklo.png);mask-size:100% 100%}
  #z14[hidden],#z14v[hidden],#zhr[hidden]{display:none}
  /* animované úseky z intro-vyloha.html: iframe přes celý frame, skrytý přes visibility (WebGL se tak načte předem) */
  #f iframe.anim{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;visibility:hidden}
  #f iframe.anim.on{visibility:visible}
  /* samostatné slidy s texty od copywritera (10. 10. 2026): pozadí = výloha předělu bez nápisu, ztlumená a rozostřená;

  #s.pozadi{filter:brightness(.5) blur(.35cqw);transform:scale(1.03)}
  #t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff}
  #t[hidden]{display:none}
  #t .in{width:60cqw}
  #t h2{margin:0 0 2.6cqw;font:300 1.5625cqw/1 'Kit Rounded',sans-serif;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.8)}
  #t p{margin:0;font:300 1.75cqw/1.62 'Kit Rounded',sans-serif;color:rgba(255,255,255,.95)}
  /* zástupný slide (placeholder): jednobarevné pozadí a věta uprostřed */
  #ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 10cqw;text-align:center;font:300 2.19cqw/1.4 'Kit Rounded',sans-serif;color:#EEE1CF}
  #ph[hidden]{display:none}
  body.idle{cursor:none}
  /* ovládání (Ondra 11. 10.): šipky vlevo / vpravo a stavový řádek „12 / 36 · Další: …“ vpravo dole; H skryje / ukáže, ?bez-animaci (snímky do PDF) bez ovládání */
  .nav{position:absolute;top:50%;z-index:10;width:3.4cqw;height:3.4cqw;margin-top:-1.7cqw;border:0;border-radius:50%;padding:0;cursor:pointer;
       background:rgba(20,14,11,.32);color:rgba(241,227,190,.9);display:grid;place-items:center;transition:background .2s,opacity .2s}
  .nav:hover{background:rgba(20,14,11,.6)}
  .nav svg{width:42%;height:42%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #navL{left:1.4cqw}#navR{right:1.4cqw}
  #stav{position:absolute;right:1.4cqw;bottom:1.4cqw;z-index:10;padding:.45cqw 1.2cqw;border-radius:999px;white-space:nowrap;
        background:rgba(20,14,11,.38);color:rgba(241,227,190,.92);font:300 .95cqw/1.2 'Kit Rounded',sans-serif;letter-spacing:.04em;pointer-events:none}
  #stav b{font-weight:300;color:#F1E3BE}#stav span{opacity:.65}
  .nav[hidden],#stav[hidden]{display:none}
  body.bez-ovladani .nav,body.bez-ovladani #stav{display:none}
  /* credit na úvodním slidu (Ondra 11. 10.): dole uprostřed malým písmem, prostrkaný Kit Rounded jako nápis STEREO MATUŠKA v intru; stín kvůli světlé denní výloze */
  #kredit{position:absolute;left:0;right:0;bottom:1.9cqw;z-index:9;text-align:center;pointer-events:none;
          font:300 .9cqw/1 'Kit Rounded',sans-serif;letter-spacing:.28em;color:rgba(255,255,255,.94);
          text-shadow:0 0 .55cqw rgba(0,0,0,.45),0 .05cqw .15cqw rgba(0,0,0,.35)}
  #kredit[hidden]{display:none}
</style>

<script>
/* Statická prezentace Stereo Matuška (návrh 8. 10. 2026): slidy jdou za sebou bez přechodů.

  '16_reveal-vyloha-polep.webp', '17_reveal-dvere-potisk.webp', '18_reveal-zboku-potisk.webp', '19_reveal-zboku-neon.webp', '20_reveal-zboku-neon-zavesy.webp', '21_reveal-neon-detail.webp',

  // neonový mráček v prostoru (visí ze stropu), za tácky (Ondra 9. 10.)
  '30_prostor-mracek-neon.webp',
  // web: Ondrovo hero (web/22.png den, web/21.png noc, 11. 10.) v mockupu notebooku – den s latte a večer se stoutem jako dva slidy
  // bez přechodu (Ondra 11. 10.: „odstraň přechod mezi slidy“); hero-web/mockup-notebook-zoom-den/noc.png – přiblížené, ať není vidět okno
  // (dřív zástupný slide placeholder:web z 10. 10.; moje verze hero-web/hero.html nepoužitá; mockupy MacBooku ve vyrazene/slideshow-31_…, 32_…)
  '31_web-hero-den.webp', '32_web-hero-noc.webp',

  'anim:ig-profil', 'anim:ig-posty',
  // interiér (bar zboku) vyřazen ze slidů (Ondra 11. 10.: „slide 32 odstraň“) – obrázek slideshow/34_interier-bar-zboku.webp zůstává jako pozadí slidu ALE
  // cenová nabídka (Ondra 11. 10., podle Prezentace/cenova_nabidka_STEREO_pro_Claude.md): 80 000 Kč, pak náš návrh 60 000 Kč + 20 000 Kč kreditem
  // na věrnostní kartě STEREO (pass ve Walletu podle karty Automatu Matuška) – nabidka/nabidka.html, snímky nabidka-snimky.py
  '40_nabidka-80000.webp',
  '40b_nabidka-ale.webp',                                       // mezi nabídkami: interiér (bar zboku) s tmavým překryvem a ALE přes celý displej (Ondra 11. 10.)
  '41_nabidka-60000-kredit.webp',
  // závěr: Ondrovo outro (final/outro/A4 - 3…11.png) do rytmu – frame stojí 0,6 s, smyčka (Ondra 10. 10.); od 11. 10. až za cenovou nabídkou; 8 framů pro PDF
  'outro',
  // úplný závěr (Ondra 11. 10.): „Ve stereu zní spolupráce nejlíp. Těšíme se!“ – zaver/zaver.html, snímek zaver-snimek.py; statický
  // (sloučení s outrem – slogan místo slov – Ondra zkusil a vrátil: „necháme ten poslední slide statický“)
  '50_zaver.webp'
];
/* Texty od copywritera (10. 10. 2026) jako samostatné slidy 'text:…' hned za předělem (Ondra: na předěly se nehodí).
   pozadi = výloha předělu bez nápisu (cesta od final/), ve slidu ztlumená a rozostřená. */
const NOC = '15.png', DEN = 'typografie/pozadi-den-ztmavene.png';
const TEXTY = {
  uvod: { nadpis: 'Úvod', pozadi: DEN, text: 'Identitu stavíme na autentické estetice 80. let, atmosféře tradičních irských pubů a dvojím rytmu podniku. Inspiraci jsme hledali v dobovém průmyslovém designu, typografii a audiotechnice, nikoli v prvoplánových retro symbolech. Zásadní roli hraje i samotná Lucerna – její charakter vždy utvářelo spojení elegance, kulturního života a nekonvenčnosti. STEREO na tyto hodnoty navazuje: je prémiové, ale neokázalé a nostalgické, ale ne staromódní.' },
  prepinac: { nadpis: 'Přepínač', pozadi: NOC, text: 'Písmeno O jsme proměnili v symbolický přepínač dvou režimů podniku. Jeho princip odkazuje na dobové ovládací prvky audiotechniky i samotný gramofon Tesla MC 600 Q, který umožňoval přepínání mezi 33 a 45 otáčkami za minutu. Dva světelné okruhy, z nichž je vždy aktivní pouze jeden, symbolizují dvě tváře Sterea – poklidný denní poslech vinylů u kávy a energický večerní provoz s pivem a živou hudbou. Typografický detail se stává funkčním symbolem celé značky.' },
  prenoska: { nadpis: 'Přenoska', pozadi: NOC, text: 'Stylizované raménko gramofonu s přenoskou elegantně uzavírá logotyp fascinovaný gramofony jejich mechanismem. Jeho poloha zároveň hravě komunikuje aktuální režim podniku, získává vlastní význam a stává se součástí promyšleného vizuálního systému.' },
  font: { nadpis: 'Font', pozadi: NOC, text: 'Základem logotypu je autorské písmo inspirované dobovou typografií propagačních materiálů gramofonu Tesla MC 600 Q – vlajkové lodi gramofonů Tesla 80. let. Charakteristické oblé tvary, výrazná geometrie a osobitý rytmus písma odkazují na estetiku tehdejšího průmyslového designu. Historickou předlohu jsme reinterpretovali do současné, svébytné podoby, která si zachovává nezaměnitelný charakter. Nevytváříme tak retro stylizaci, ale vizuální identitu s autentickými kořeny v dobovém průmyslovém designu.' },
  barvy: { nadpis: 'Barvy', pozadi: NOC, text: 'Barevně propojujeme dva zdánlivě vzdálené světy – atmosféru tradičních irských pubů a vizuální kulturu 80. let. Večerní paleta vychází z barev irské trikolóry, které jsme posunuli do tlumených, zemitých vintage odstínů terakoty, meruňkové a šalvějové. Denní komunikace naopak pracuje s hřejivými tóny hnědé, bronzu a krémové, evokujícími patinu starého papíru, typické kartony, obaly gramodesek, dřevěný nábytek i zažloutlé stránky knih. Dvě odlišné barevné nálady vytvářejí jeden soudržný vizuální svět, který přirozeně mění atmosféru spolu s rytmem podniku.' }
};
// česká sazba: jednopísmenné předložky a spojky a číslo s jednotkou nezůstanou na konci řádku, pomlčka nezačne řádek
const sazba = t => t.replace(/(^|[\s(])([vkszaiouVKSZAIOU])\s/g, '$1$2 ').replace(/(^|[\s(])([vkszaiouVKSZAIOU])\s/g, '$1$2 ')
  .replace(/(\d)\s(?=\S)/g, '$1 ').replace(/\s–/g, ' –');
const tsl = document.getElementById('t'), tH = tsl.querySelector('h2'), tP = tsl.querySelector('p');
const textSlidu = n => n.startsWith('text:') ? TEXTY[n.slice(5)] : null;
// zástupné slidy 'placeholder:…' – lahvově zelená #2F4537 (logo_1.svg), krémový text #EEE1CF
const PLACEHOLDERY = { web: { barva: '#2F4537', text: 'Tady budou textace hero sekce webu.' } };
const placeholder = n => n.startsWith('placeholder:') ? PLACEHOLDERY[n.slice(12)] : null;
const frame = document.getElementById('f'), phd = document.getElementById('ph');
// animované úseky z intro-vyloha.html (Ondra 10. 10.): intro, přepínač, logo – každý ve vlastním iframe, načtený předem a pozastavený;
// při vstupu dostane {cmd:'start', back}, na konci úseku pošle {done:'next'|'prev'}, klávesy Home / End / F přepošle sem
const animSlidu = n => n.startsWith('anim:') ? n.slice(5) : null;
const ANIM = {}, ANIM_READY = new Set();
// úseky mimo intro-vyloha.html (stejný protokol start / pause / next / prev, ready / done / key)
const ANIM_SRC = { 'nalezato': 'koncept/prepinac-nalezato.html?usek=nalezato',
                   'ig-profil': 'socialni%20site/instagram-slide.html?usek=ig-profil&vyrez#profil',
                   'ig-posty': 'socialni%20site/instagram-slide.html?usek=ig-posty#post-18,post-19,post-20' };
if (!/bez-animaci/.test(location.search)) for (const u of new Set(SLIDES.map(animSlidu).filter(Boolean))) {
  const f = document.createElement('iframe');
  f.className = 'anim'; f.title = u; f.src = ANIM_SRC[u] || 'intro-vyloha.html#usek=' + u;
  frame.appendChild(f); ANIM[u] = f;
}
let animBack = false, animOd = 0;                  // animOd: čas, od kterého má úsek začít (navázání přepínače naležato na anatomii)
function animStart(u) { if (!ANIM_READY.has(u)) return; ANIM[u].contentWindow.postMessage({ cmd: 'start', back: animBack, od: animOd }, '*'); animOd = 0; ANIM[u].focus(); }
addEventListener('message', e => {
  const u = Object.keys(ANIM).find(k => ANIM[k].contentWindow === e.source); if (!u) return;
  const d = e.data || {};
  if (d.ready) { ANIM_READY.add(u); if (animSlidu(SLIDES[cur]) === u) animStart(u); return; }
  if (animSlidu(SLIDES[cur]) !== u) return;
  if (d.prime !== undefined) { const n = ANIM[animSlidu(SLIDES[cur + 1] || '')]; if (n) n.contentWindow.postMessage({ cmd: 'prime', od: d.prime }, '*'); return; }
  if (d.done === 'next') { animOd = d.navaz || 0; show(cur + 1); }
  else if (d.done === 'prev') { if (cur > 0) show(cur - 1); }
  else if (d.key === 'Home') show(0);
  else if (d.key === 'End') show(SLIDES.length - 1);
  else if (d.key === 'KeyF') celaObrazovka();
  else if (d.key === 'KeyH') skrytOvladani();
});
// dvojice den ↔ noc (jeden slide, šipka prolne den → noc) – použije pre i prolnutí níže. Od 11. 10. prázdné: plakáty i hero webu
// jsou na Ondrovo přání dva slidy bez přechodu. Vrácení plakátů: položka 'plakaty' v SLIDES a sem
// plakaty: { den: 'slideshow/26_eventy-mockup-den.webp', noc: 'slideshow/27_eventy-mockup-noc-zarovnany.webp' } (noc srovnaná na denní plakát, eventy/mockupy/zarovnani-noc.py)
const DVOJICE = {};
const img = document.getElementById('s');
// vše předem načíst, ať je střih okamžitý; když se obrázek nenačte (výpadek sítě), zkusí se znovu
const pre = SLIDES.map((n, k) => {
  const i = new Image(); let tries = 0;
  if (placeholder(n) || animSlidu(n) || n === 'outro') return i;   // bez obrázku
  const url = textSlidu(n) ? textSlidu(n).pozadi : DVOJICE[n] ? DVOJICE[n].den : 'slideshow/' + n;
  i.onerror = () => { if (++tries <= 5) setTimeout(() => { i.src = url + '?r=' + tries; }, 400 * tries); };
  i.onload = () => { if (k === cur) img.src = i.src; };
  i.src = url; return i;
});
let cur = 0;
function show(i) {
  const was = cur;
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  animBack = cur === was - 1;                    // konečný stav animace jen při kroku o jeden slide zpět; skok (Home, #N) = od začátku
  const a = animSlidu(SLIDES[cur]);
  for (const u in ANIM) { const on = u === a; ANIM[u].classList.toggle('on', on); if (!on) ANIM[u].contentWindow.postMessage({ cmd: 'pause' }, '*'); }
  if (a) animStart(a); else if (document.activeElement && document.activeElement.tagName === 'IFRAME') document.activeElement.blur();
  const ph = placeholder(SLIDES[cur]);
  img.hidden = !!(ph || a || SLIDES[cur] === 'outro'); if (!img.hidden) img.src = pre[cur].src;
  if (SLIDES[cur] === 'outro') outroStart(); else outroStop();
  const dv = DVOJICE[SLIDES[cur]]; pnoc.hidden = !dv; if (dv) pnoc.src = dv.noc;
  dvojiceNoc(animBack && !!dv, true);                                                              // mimo dvojice se rozběhnuté prolnutí zastaví
  if (!pnoc.hidden && OUTRO_CAS !== undefined) pnoc.style.opacity = ease(Math.min(1, OUTRO_CAS / 1.4)).toFixed(3);   // ladění &cas=
  neonStart(SLIDES[cur]);
